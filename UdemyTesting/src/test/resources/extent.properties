# =====================================================
# EXTENT REPORTS CONFIGURATION
# For ExtentReports Cucumber7 Adapter v1.14.0
# =====================================================

# Spark HTML Reporter Configuration
extent.reporter.spark.start=true
extent.reporter.spark.out=test-output/reports/ExtentReport.html

# PDF Reporter Configuration
extent.reporter.pdf.start=true
extent.reporter.pdf.out=test-output/reports/ExtentReport.pdf

# Screenshot Configuration
screenshot.dir=test-output/screenshots/
screenshot.rel.path=../screenshots/

# Base folder for reports
basefolder.name=test-output/reports/
basefolder.datetimepattern=yyyy-MM-dd_HH-mm-ss

# Report Theme (standard or dark)
extent.reporter.spark.base64imagesrc=true

# System Information
systeminfo.OS=Mac OS
systeminfo.User=QA Team
systeminfo.Build=1.0.0
systeminfo.AppName=Udemy Test Automation
systeminfo.Environment=QA
systeminfo.Browser=Chrome

# PDF Report Settings
extent.reporter.pdf.base64imagesrc=true

# Spark Report View Order
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# Report Title and Document Title
extent.reporter.spark.title=Udemy Test Automation Report
extent.reporter.spark.documenttitle=Udemy QA Report

# Enable/Disable offline mode (uses CDN for CSS/JS if false)
extent.reporter.spark.offlinemode=false
